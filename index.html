<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLAY ALLCUBE</title>
<meta name="description" content="플레이 올큐브 — 예약, 진단, 타이머, 콘테스트를 한 곳에서">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALLCUBE">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0B1834;
    --navy-deep:#060C1C;
    --blue:#2F6BFF;
    --yellow:#FFC844;
    --orange:#F26722;
    --green:#159B4E;
    --red:#D01C28;
    --white:#F5F5F5;
    --paper:#F5F5F5;
    --slate:#132140;
    --slate-2:#182A4F;
    --mist:#8FA3C8;
    --radius:18px;
    --gap:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 70% at 50% -10%, #14275A 0%, var(--navy) 55%, var(--navy-deep) 100%);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:28px 20px 40px;
  }

  /* ---- Header ---- */
  header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
  }
  header .titles{ flex:1; min-width:0; }
  .install-cta{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--yellow);
    color:var(--navy-deep);
    border:none;
    border-radius:999px;
    padding:9px 13px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:12px;
    line-height:1;
    white-space:nowrap;
  }
  .install-cta:active{ transform:scale(0.96); }
  .install-cta.is-installed{
    background:var(--slate);
    color:var(--mist);
  }
  .install-cta .ic{ font-size:13px; }
  .mark{
    width:38px;height:38px;
    flex-shrink:0;
    display:block;
    animation:markSpin 14s linear infinite;
  }
  .mark svg{ display:block; width:100%; height:100%; }
  @media (prefers-reduced-motion:reduce){ .mark{animation:none;} }
  @keyframes markSpin{
    0%,92%{transform:rotate(0deg);}
    96%{transform:rotate(180deg);}
    100%{transform:rotate(180deg);}
  }
  header h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    font-weight:700;
    letter-spacing:0.2px;
    margin:0;
    line-height:1.1;
  }
  header p{
    margin:2px 0 0;
    font-size:12px;
    color:var(--mist);
  }

  /* ---- Hero ---- */
  .hero{
    margin-bottom:24px;
  }
  .hero h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    line-height:1.28;
    font-weight:600;
    margin:0;
    color:var(--paper);
  }
  .hero h2 em{
    color:var(--blue);
    font-style:normal;
  }

  /* ---- Cube face grid (signature element) ---- */
  .cube-face{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:var(--gap);
    background:var(--navy-deep);
    padding:var(--gap);
    border-radius:22px;
    margin-top:24px;
  }
  .sticker{
    aspect-ratio:1/1;
    border-radius:var(--radius);
    background:var(--slate);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:12px;
    text-decoration:none;
    color:var(--paper);
    position:relative;
    overflow:hidden;
    transition:transform .15s ease, background .15s ease;
    border:1px solid rgba(255,255,255,0.04);
  }
  .sticker:active{ transform:scale(0.95); }
  .sticker .icon{
    font-size:20px;
    line-height:1;
  }
  .sticker .label{
    font-family:'Space Grotesk',sans-serif;
    font-size:12.5px;
    font-weight:600;
    line-height:1.25;
  }
  .sticker .sub{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    color:var(--mist);
    margin-top:2px;
    display:block;
  }

  /* colored cells: read like actual cube sticker faces */
  .sticker.yellow{ background:var(--yellow); color:var(--navy-deep); }
  .sticker.orange{ background:var(--orange); color:var(--paper); }
  .sticker.green{ background:var(--green); color:var(--paper); }
  .sticker.red{ background:var(--red); color:var(--paper); }
  .sticker.white{ background:var(--white); color:var(--navy-deep); }
  .sticker.accent{ background:var(--blue); color:var(--paper); }

  .sticker:not(.yellow):not(.orange):not(.green):not(.red):not(.white):not(.accent):hover{ background:var(--slate-2); }


  /* wide contact strip */
  .contact{
    margin-top:var(--gap);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 16px;
    border-radius:var(--radius);
    background:var(--navy-deep);
    border:1px dashed rgba(143,163,200,0.35);
    text-decoration:none;
    color:var(--paper);
  }
  .contact .txt{ font-size:13px; }
  .contact .txt b{ display:block; font-family:'Space Grotesk',sans-serif; font-size:14px; margin-bottom:2px; }
  .contact .go{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--yellow);
    white-space:nowrap;
  }

  footer{
    margin-top:30px;
    text-align:center;
    font-size:11px;
    color:var(--mist);
    line-height:1.7;
  }
  footer a{ color:var(--mist); }

  .install-modal{
    position:fixed;
    inset:0;
    background:rgba(6,12,28,0.66);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
    padding:16px;
  }
  .install-modal.show{ display:flex; }
  .install-modal .sheet{
    width:100%;
    max-width:460px;
    background:var(--slate-2);
    border:1px solid rgba(255,200,68,0.25);
    border-radius:20px;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
  }
  .install-modal h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .install-modal h3 button{
    background:transparent;
    color:var(--mist);
    border:none;
    font-size:16px;
    padding:2px 4px;
  }
  .install-modal ol{
    margin:0;
    padding-left:18px;
    font-size:13px;
    line-height:1.75;
    color:var(--paper);
  }
  .install-modal ol b{ color:var(--yellow); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <rect width="512" height="512" rx="112" ry="112" fill="#0B1834"></rect>
          <g transform="translate(106,106) scale(8.823529411764707)">
            <rect x="0" y="0" width="10" height="10" rx="2.2" ry="2.2" fill="#FFC844"></rect>
            <rect x="12" y="0" width="10" height="10" rx="2.2" ry="2.2" fill="#3B7BFF"></rect>
            <rect x="24" y="0" width="10" height="10" rx="2.2" ry="2.2" fill="#FFFFFF"></rect>
            <rect x="0" y="12" width="10" height="10" rx="2.2" ry="2.2" fill="#FFFFFF"></rect>
            <rect x="12" y="12" width="10" height="10" rx="2.2" ry="2.2" fill="#FFC844"></rect>
            <rect x="24" y="12" width="10" height="10" rx="2.2" ry="2.2" fill="#3B7BFF"></rect>
            <rect x="0" y="24" width="10" height="10" rx="2.2" ry="2.2" fill="#3B7BFF"></rect>
            <rect x="12" y="24" width="10" height="10" rx="2.2" ry="2.2" fill="#FFFFFF"></rect>
            <rect x="24" y="24" width="10" height="10" rx="2.2" ry="2.2" fill="#FFC844"></rect>
          </g>
        </svg>
      </div>
      <div class="titles">
        <h1>PLAY ALLCUBE</h1>
      </div>
      <button class="install-cta" id="installBtn" type="button">
        <span class="ic">⬇</span><span class="txt">홈 화면에 추가</span>
      </button>
    </header>

    <div class="hero">
      <h2>큐브는 순간의 놀이가 아니라,<br><em>평생의 취미</em>입니다.</h2>
    </div>

    <nav class="cube-face">
      <a class="sticker white" href="https://playallcube.com/diagnosis" target="_blank" rel="noopener">
        <span class="icon">📊</span>
        <span><span class="label">큐브 레벨 진단</span></span>
      </a>

      <a class="sticker" href="https://playallcube.com/diagnosis?tab=next" target="_blank" rel="noopener">
        <span class="icon">🧭</span>
        <span><span class="label">큐브 네비게이터</span></span>
      </a>

      <a class="sticker orange" href="https://playallcube.com/diagnosis?tab=mbti" target="_blank" rel="noopener">
        <span class="icon">🧠</span>
        <span><span class="label">큐브 성향 진단</span></span>
      </a>

      <a class="sticker yellow" href="https://unrivaled-sorbet-6dbee1.netlify.app" target="_blank" rel="noopener">
        <span class="icon">⏱️</span>
        <span><span class="label">큐브 타이머</span></span>
      </a>

      <a class="sticker accent" href="https://chobuhong-coder.github.io/allcube-contes/" target="_blank" rel="noopener">
        <span class="icon">🏆</span>
        <span><span class="label">큐브 콘테스트</span></span>
      </a>

      <a class="sticker" href="https://playallcube.com/18" target="_blank" rel="noopener">
        <span class="icon">🎬</span>
        <span><span class="label">피드백 갤러리</span></span>
      </a>

      <a class="sticker green" href="https://playallcube.com/17" target="_blank" rel="noopener">
        <span class="icon">🎓</span>
        <span><span class="label">교육프로그램</span></span>
      </a>

      <a class="sticker" href="https://serene-eclair-60bb2b.netlify.app" target="_blank" rel="noopener">
        <span class="icon">🧩</span>
        <span><span class="label">큐브놀이터</span></span>
      </a>

      <a class="sticker red" href="https://allcube.shop" target="_blank" rel="noopener">
        <span class="icon">🛒</span>
        <span><span class="label">올큐브샾</span></span>
      </a>
    </nav>

    <a class="contact" href="https://map.kakao.com/?q=경기 구리시 안골로 3 마지아빌딩" target="_blank" rel="noopener">
      <span class="txt"><b>오프라인 코칭 스튜디오</b>경기 구리시 안골로 3, 마지아빌딩 5층</span>
      <span class="go">지도 열기 →</span>
    </a>

    <footer>
      주식회사 올큐브 · PLAY ALLCUBE<br>
      <a href="https://playallcube.com" target="_blank" rel="noopener">playallcube.com</a> · <a href="https://allcube.shop" target="_blank" rel="noopener">allcube.shop</a>
    </footer>
  </div>

  <div class="install-modal" id="installModal">
    <div class="sheet">
      <h3><span>홈 화면에 추가하기</span><button id="modalClose" type="button">✕</button></h3>
      <ol id="modalSteps"></ol>
    </div>
  </div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  const installBtn = document.getElementById('installBtn');
  const modal = document.getElementById('installModal');
  const modalSteps = document.getElementById('modalSteps');

  const ua = navigator.userAgent.toLowerCase();
  const isIOS = /iphone|ipad|ipod/.test(ua);
  const isAndroid = /android/.test(ua);
  const isStandalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  function markInstalled(){
    installBtn.classList.add('is-installed');
    installBtn.querySelector('.txt').textContent = '설치됨';
    installBtn.querySelector('.ic').textContent = '✓';
  }

  if (isStandalone) markInstalled();

  window.addEventListener('appinstalled', markInstalled);

  function showSteps(stepsHtml){
    modalSteps.innerHTML = stepsHtml;
    modal.classList.add('show');
  }

  installBtn.addEventListener('click', async () => {
    if (isStandalone) return; // already installed, nothing to do

    // Android / desktop Chrome with native prompt available: fire it immediately
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (choice.outcome === 'accepted') markInstalled();
      return;
    }

    // iOS Safari: no install API exists, show exact manual steps
    if (isIOS) {
      showSteps(`
        <li>화면 하단(또는 상단) <b>공유 버튼(⬆️)</b>을 탭하세요</li>
        <li>메뉴를 아래로 내려 <b>"홈 화면에 추가"</b>를 탭하세요</li>
        <li>오른쪽 위 <b>"추가"</b>를 탭하면 완료돼요</li>
      `);
      return;
    }

    // Android Chrome without a fired prompt yet, or other browsers
    if (isAndroid) {
      showSteps(`
        <li>오른쪽 위 <b>점 3개(⋮) 메뉴</b>를 탭하세요</li>
        <li><b>"홈 화면에 추가"</b> 또는 <b>"앱 설치"</b>를 탭하세요</li>
        <li>확인 팝업에서 <b>"추가"</b>를 탭하면 완료돼요</li>
      `);
      return;
    }

    // Desktop fallback (non-Chromium or prompt not ready yet)
    showSteps(`
      <li>주소창 오른쪽의 <b>설치 아이콘</b>을 클릭하세요</li>
      <li>또는 브라우저 메뉴에서 <b>"앱 설치"</b>를 찾아 클릭하세요</li>
    `);
  });

  document.getElementById('modalClose').addEventListener('click', () => {
    modal.classList.remove('show');
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('show');
  });
</script>
</body>
</html>
